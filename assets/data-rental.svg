<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="vm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8fa8f0"/>
      <stop offset="1" stop-color="#5b7fd6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a1a1a6"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e0a93b"/>
    </marker>
  </defs>

  <!-- Data owner -->
  <g transform="translate(40 58)">
    <rect width="230" height="204" rx="22" fill="#1c1c1e" stroke="#3a3a3c"/>
    <text x="24" y="38" fill="#a1a1a6" font-size="14" font-weight="700" letter-spacing="1">DATA OWNER</text>
    <g font-family="Menlo, 'SF Mono', monospace" font-size="12" fill="#e0a93b">
      <rect x="24" y="58" width="182" height="28" rx="7" fill="#2c2c2e"/>
      <text x="36" y="77">9f2e…a1 · encrypted</text>
      <rect x="24" y="94" width="182" height="28" rx="7" fill="#2c2c2e"/>
      <text x="36" y="113">4c7b…d0 · encrypted</text>
      <rect x="24" y="130" width="182" height="28" rx="7" fill="#2c2c2e"/>
      <text x="36" y="149">b310…77 · encrypted</text>
    </g>
    <text x="24" y="186" fill="#f5f5f7" font-size="14">Approves one fingerprint</text>
  </g>

  <!-- Key path: owner -> VM -->
  <path d="M272 160 L352 160" stroke="#e0a93b" stroke-width="2.5" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="312" y="146" fill="#e0a93b" font-size="12" text-anchor="middle" font-weight="600">key</text>

  <!-- Confidential VM -->
  <g transform="translate(356 36)">
    <rect width="250" height="248" rx="26" fill="url(#vm)"/>
    <rect x="12" y="12" width="226" height="224" rx="18" fill="#101114" opacity=".92"/>
    <text x="125" y="48" fill="#f5f5f7" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">CONFIDENTIAL VM</text>
    <text x="125" y="68" fill="#a1a1a6" font-size="12" text-anchor="middle">Google Cloud · Intel TDX · attested</text>
    <!-- approved image -->
    <rect x="30" y="90" width="190" height="48" rx="10" fill="#1f2a1f" stroke="#3e8e53"/>
    <text x="46" y="110" fill="#f5f5f7" font-size="12" font-family="Menlo, 'SF Mono', monospace">sha256:51bca99c…58ee</text>
    <text x="46" y="128" fill="#7dd48f" font-size="12" font-weight="700">approved · key released</text>
    <!-- modified image -->
    <rect x="30" y="152" width="190" height="48" rx="10" fill="#2a1d1d" stroke="#9c4a3f"/>
    <text x="46" y="172" fill="#f5f5f7" font-size="12" font-family="Menlo, 'SF Mono', monospace">sha256:59c7719a…5634</text>
    <text x="46" y="190" fill="#e8774f" font-size="12" font-weight="700">one line changed · refused</text>
    <text x="125" y="226" fill="#a1a1a6" font-size="12" text-anchor="middle">decrypts in memory, deleted after the run</text>
  </g>

  <!-- Code path: party -> VM -->
  <path d="M688 120 L610 120" stroke="#a1a1a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="649" y="108" fill="#a1a1a6" font-size="12" text-anchor="middle" font-weight="600">image</text>
  <!-- Result path: VM -> party -->
  <path d="M610 200 L688 200" stroke="#8fa8f0" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="649" y="222" fill="#8fa8f0" font-size="12" text-anchor="middle" font-weight="600">sealed result</text>

  <!-- Computation party -->
  <g transform="translate(690 58)">
    <rect width="230" height="204" rx="22" fill="#1c1c1e" stroke="#3a3a3c"/>
    <text x="24" y="38" fill="#a1a1a6" font-size="14" font-weight="700" letter-spacing="1">COMPUTATION PARTY</text>
    <g font-family="Menlo, 'SF Mono', monospace" font-size="12" fill="#8fa8f0">
      <text x="24" y="72">def run(shards, schema):</text>
      <text x="24" y="92" fill="#a1a1a6">    counts = [0] * 10</text>
      <text x="24" y="112" fill="#a1a1a6">    for shard in shards: …</text>
      <text x="24" y="132" fill="#a1a1a6">    return summary</text>
    </g>
    <text x="24" y="186" fill="#f5f5f7" font-size="14">Never sees a record</text>
  </g>
</svg>
